<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#DCE3EE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #262E3B; font-family: Inter, -apple-system, system-ui, sans-serif; color: #F4F6FA">

  <div aria-hidden="true" style="position: absolute; inset: -60px; background: {{bg.sky}}; filter: blur(50px); transition: background 500ms ease">
    <div style="position: absolute; left: 0; right: 0; bottom: 30%; height: 35%; background: {{bg.far}}; transition: background 500ms ease"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: {{bg.near}}; transition: background 500ms ease"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(31,38,51,0.55)"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 56px 0 30px; gap: 16px; box-sizing: border-box">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
      <a href="Albums.dc.html" aria-label="Back to albums" style="width: 42px; height: 42px; border-radius: 21px; border: 1px solid rgba(255,255,255,0.34); background: rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 30px rgba(10,14,22,0.28); display: flex; align-items: center; justify-content: center; color: #F4F6FA">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 26px; line-height: 1.1">{{albumName}}</span>
        <span style="font-size: 12px; letter-spacing: 0.4px; color: #C9D2E0">{{counter}}</span>
      </div>
      <a href="Confirm.dc.html" aria-label="Review marked items" style="height: 42px; min-width: 42px; padding: 0 14px; box-sizing: border-box; border-radius: 21px; border: 1px solid rgba(255,255,255,0.34); background: rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 30px rgba(10,14,22,0.28); display: flex; align-items: center; gap: 7px; color: #F4F6FA; font-size: 14px; font-weight: 600; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2B8A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>{{markedCount}}
      </a>
    </div>

    <div style="display: flex; gap: 8px; padding: 0 20px; overflow: hidden">
      <sc-for list="{{albums}}" as="al" hint-placeholder-count="4">
        <button onClick="{{al.pick}}" style="flex-shrink: 0; height: 32px; padding: 0 15px; border-radius: 16px; border: {{al.border}}; background: {{al.bg}}; color: {{al.fg}}; font-family: inherit; font-size: 13px; font-weight: {{al.weight}}; cursor: pointer">{{al.name}}</button>
      </sc-for>
    </div>

    <div style="position: relative; flex-grow: 1; min-height: 0">
      <sc-if value="{{hasPrev}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{undo}}" aria-label="Undo: bring back previous photo" style="position: absolute; top: 36px; bottom: 36px; left: -264px; width: 290px; border: 1px solid rgba(255,255,255,0.14); padding: 0; border-radius: 26px; background: {{prev.sky}}; overflow: hidden; cursor: pointer; opacity: 0.75">
          <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: {{prev.near}}; clip-path: polygon(0 30%, 25% 0, 45% 40%, 70% 10%, 100% 45%, 100% 100%, 0 100%)"></div>
          <span style="position: absolute; right: 6px; top: 50%; width: 8px; height: 8px; border-radius: 4px; background: {{prev.dot}}"></span>
        </button>
      </sc-if>
      <sc-if value="{{hasNext}}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="position: absolute; top: 36px; bottom: 36px; left: 364px; width: 290px; border: 1px solid rgba(255,255,255,0.14); border-radius: 26px; background: {{next.sky}}; overflow: hidden; opacity: 0.75">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: {{next.near}}; clip-path: polygon(0 30%, 25% 0, 45% 40%, 70% 10%, 100% 45%, 100% 100%, 0 100%)"></div>
        </div>
      </sc-if>

      <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; top: 0; bottom: 0; left: 40px; width: 310px; border-radius: 30px; overflow: hidden; background: {{photo.sky}}; border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 30px 60px rgba(10,14,22,0.45); transform: {{cardTransform}}; opacity: {{cardOpacity}}; transition: {{cardTransition}}">
          <div aria-hidden="true" style="position: absolute; right: 54px; top: 80px; width: 46px; height: 46px; border-radius: 23px; background: {{photo.sun}}; opacity: 0.9"></div>
          <div aria-hidden="true" style="position: absolute; left: -10%; right: -10%; bottom: 30%; height: 40%; background: {{photo.far}}; clip-path: polygon(0 100%, 18% 35%, 34% 70%, 52% 10%, 70% 60%, 86% 30%, 100% 100%)"></div>
          <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: {{photo.near}}; clip-path: polygon(0 30%, 25% 0, 45% 40%, 70% 10%, 100% 45%, 100% 100%, 0 100%)"></div>
          <div aria-hidden="true" style="position: absolute; inset: 0; background: {{tint}}; transition: background 200ms ease"></div>
          <sc-if value="{{showStamp}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.5); background: rgba(31,38,51,0.32); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.30); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 2px; color: #FFFFFF">
              <span style="width: 7px; height: 7px; border-radius: 4px; background: {{stampDot}}"></span>{{stampText}}
            </div>
          </sc-if>
          <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 14px 16px; border-radius: 20px; background: rgba(31,38,51,0.32); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.30); border: 1px solid rgba(255,255,255,0.30); display: flex; flex-direction: column; align-items: center; gap: 2px">
            <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; color: #FFFFFF">{{photo.date}}</span>
            <span style="font-size: 11px; font-weight: 500; letter-spacing: 1.6px; text-transform: uppercase; color: #D5DCE7">{{photo.kind}}</span>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; top: 0; bottom: 0; left: 40px; width: 310px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 30px rgba(10,14,22,0.28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 28px; box-sizing: border-box; text-align: center">
          <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 34px">That’s all</span>
          <span style="font-size: 14px; color: #C9D2E0">{{markedText}}</span>
          <a href="Confirm.dc.html" style="margin-top: 14px; height: 50px; padding: 0 26px; border-radius: 25px; background: #E6ECF5; color: #1F2633; font-size: 15px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Review deletions</a>
        </div>
      </sc-if>
    </div>

    <div style="margin: 0 44px; padding: 12px 18px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.34); background: rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 30px rgba(10,14,22,0.28); display: flex; align-items: center; justify-content: space-between">
      <button onClick="{{del}}" aria-label="Delete" style="width: 70px; height: 70px; border-radius: 35px; border: 1px solid {{delBorder}}; background: {{delBg}}; color: #F2B8A8; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 180ms ease">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button onClick="{{undo}}" aria-label="Undo last swipe" style="width: 46px; height: 46px; border-radius: 23px; border: 1px solid rgba(255,255,255,0.34); background: rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 30px rgba(10,14,22,0.28); color: #DCE3EE; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button onClick="{{keep}}" aria-label="Keep" style="width: 70px; height: 70px; border-radius: 35px; border: 1px solid {{keepBorder}}; background: {{keepBg}}; color: #A9DCCD; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 180ms ease">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { album: 1, index: 0, history: [], phase: 'idle' };
    this.albumNames = ['All Photos', 'Screenshots', 'Videos', 'Selfies', 'Lisbon'];
    this.photos = [
      { sky: '#8EA3BF', far: '#5E6F8A', near: '#2E3A4F', sun: '#E9EEF5', date: '12 March 2024', kind: 'Photo' },
      { sky: '#D9A88F', far: '#8B6B73', near: '#3F3442', sun: '#F6D7C3', date: '12 March 2024', kind: 'Screenshot' },
      { sky: '#3B4A6B', far: '#2A3550', near: '#161D2E', sun: '#DCE3EE', date: '14 March 2024', kind: 'Photo' },
      { sky: '#A9BFB6', far: '#6E8A80', near: '#2F4640', sun: '#EEF4F1', date: '2 April 2024', kind: 'Live Photo' },
      { sky: '#C9A3B5', far: '#866A80', near: '#3E3044', sun: '#F3E2EA', date: '2 April 2024', kind: 'Video · 0:14' },
      { sky: '#B8C0CC', far: '#7D8796', near: '#3D4552', sun: '#EEF1F5', date: '9 May 2024', kind: 'Screenshot' }
    ];
  }
  decide(choice) {
    const s = this.state;
    if (s.phase !== 'idle' || s.index >= this.photos.length) return;
    this.setState({ phase: choice });
    setTimeout(() => {
      this.setState({ phase: 'enter', index: this.state.index + 1, history: this.state.history.concat([choice]) });
      setTimeout(() => this.setState({ phase: 'idle' }), 30);
    }, 340);
  }
  renderVals() {
    const s = this.state;
    const total = this.photos.length;
    const marked = s.history.filter((c) => c === 'delete').length;
    const hasPhoto = s.index < total;
    const p = this.photos[Math.min(s.index, total - 1)];
    const prevChoice = s.history[s.history.length - 1];
    const prevPhoto = s.index > 0 ? this.photos[s.index - 1] : this.photos[0];
    const nextPhoto = this.photos[Math.min(s.index + 1, total - 1)];
    const glass = 'rgba(255,255,255,0.10)';
    const line = 'rgba(255,255,255,0.28)';
    const transforms = {
      idle: 'translateX(0) rotate(0deg) scale(1)',
      delete: 'translateX(-360px) rotate(-10deg) scale(0.92)',
      keep: 'translateX(360px) rotate(10deg) scale(0.92)',
      enter: 'translateX(320px) scale(0.92)'
    };
    return {
      bg: p,
      albumName: this.albumNames[s.album],
      albums: this.albumNames.map((n, i) => ({
        name: n,
        bg: i === s.album ? '#E6ECF5' : 'rgba(255,255,255,0.12)',
        fg: i === s.album ? '#1F2633' : '#DCE3EE',
        border: i === s.album ? '1px solid #E6ECF5' : '1px solid rgba(255,255,255,0.28)',
        weight: i === s.album ? 600 : 500,
        pick: () => this.setState({ album: i, index: 0, history: [], phase: 'idle' })
      })),
      counter: Math.min(s.index + 1, total) + ' of ' + total,
      markedCount: marked,
      hasPhoto: hasPhoto,
      finished: !hasPhoto,
      hasPrev: s.index > 0,
      hasNext: s.index < total - 1,
      photo: p,
      prev: Object.assign({}, prevPhoto, { dot: prevChoice === 'delete' ? '#F2B8A8' : '#A9DCCD' }),
      next: nextPhoto,
      cardTransform: transforms[s.phase],
      cardOpacity: s.phase === 'delete' || s.phase === 'keep' ? 0 : 1,
      cardTransition: s.phase === 'enter' ? 'none' : 'transform 340ms cubic-bezier(.2,.8,.2,1), opacity 340ms ease',
      tint: s.phase === 'delete' ? 'rgba(226,120,100,0.28)' : s.phase === 'keep' ? 'rgba(110,190,170,0.28)' : 'rgba(0,0,0,0)',
      showStamp: s.phase === 'delete' || s.phase === 'keep',
      stampDot: s.phase === 'delete' ? '#F2B8A8' : '#A9DCCD',
      stampText: s.phase === 'delete' ? 'DELETE' : 'KEEP',
      delBg: s.phase === 'delete' ? 'rgba(242,184,168,0.28)' : glass,
      delBorder: s.phase === 'delete' ? '#F2B8A8' : line,
      keepBg: s.phase === 'keep' ? 'rgba(169,220,205,0.28)' : glass,
      keepBorder: s.phase === 'keep' ? '#A9DCCD' : line,
      markedText: marked === 0 ? 'Nothing marked — you kept everything.' : marked + (marked === 1 ? ' photo' : ' photos') + ' marked for deletion.',
      del: () => this.decide('delete'),
      keep: () => this.decide('keep'),
      undo: () => {
        if (s.phase !== 'idle' || s.history.length === 0) return;
        this.setState({ index: s.index - 1, history: s.history.slice(0, -1) });
      }
    };
  }
}
</script>
</body>
</html>
