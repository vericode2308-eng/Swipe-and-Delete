<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#DCE3EE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; isolation: isolate; background: #262E3B; font-family: Inter, -apple-system, system-ui, sans-serif; color: #F4F6FA">
  <!-- blurred sunset backdrop + colour field -->
  <div aria-hidden="true" style="position: absolute; inset: -60px; background: #D9A88F; filter: blur(60px)">
    <div style="position: absolute; left: 0; right: 0; bottom: 30%; height: 35%; background: #8B6B73"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: #3F3442"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(31,38,51,0.62)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 460px; overflow: hidden">
    <div style="position: absolute; left: 35px; top: 68px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(169,220,205,0.55) 0%, rgba(242,184,168,0.30) 45%, rgba(38,46,59,0) 70%); opacity: {{glow}}; transform: scale({{glowScale}})"></div>
  </div>

  <!-- the deleted photos, gathering into the ring -->
  <div aria-hidden="true" style="position: absolute; left: 195px; top: 228px; width: 0; height: 0">
    <sc-for list="{{tiles}}" as="tl" hint-placeholder-count="7">
      <div style="position: absolute; left: -30px; top: -38px; width: 60px; height: 76px; border-radius: 14px; overflow: hidden; background: {{tl.sky}}; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 10px 24px rgba(10,14,22,0.35); transform: {{tl.transform}}; opacity: {{tl.opacity}}">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: {{tl.near}}; clip-path: polygon(0 30%, 25% 0, 45% 40%, 70% 10%, 100% 45%, 100% 100%, 0 100%)"></div>
      </div>
    </sc-for>
  </div>

  <!-- ring: glass disc, progress stroke, count-up -->
  <button onClick="{{replay}}" aria-label="{{ringLabel}}" style="position: absolute; left: 77px; top: 110px; width: 236px; height: 236px; padding: 0; border: 0; background: transparent; color: inherit; font-family: inherit; cursor: pointer">
    <div style="position: absolute; left: 20px; top: 20px; width: 196px; height: 196px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.34); background: rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 30px rgba(10,14,22,0.28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <div style="display: flex; align-items: baseline; gap: 6px">
        <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums">{{amount}}</span>
        <span style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 26px; color: #DCE3EE">{{unit}}</span>
      </div>
      <span style="font-size: 11px; font-weight: 500; letter-spacing: 1.6px; color: #C9D2E0">CLEARED</span>
    </div>
    <svg width="236" height="236" viewBox="0 0 236 236" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E6ECF5"/>
          <stop offset="0.55" stop-color="#A9DCCD"/>
          <stop offset="1" stop-color="#F2B8A8"/>
        </linearGradient>
      </defs>
      <circle cx="118" cy="118" r="110" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="6"/>
      <circle cx="118" cy="118" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="691.15" stroke-dashoffset="{{dash}}"/>
    </svg>
    <span style="position: absolute; left: 96px; top: 206px; width: 44px; height: 44px; border-radius: 22px; background: #A9DCCD; color: #1F2633; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(10,14,22,0.35), inset 0 1px 0 rgba(255,255,255,0.6); transform: scale({{checkScale}}); opacity: {{checkOpacity}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </span>
  </button>

  <!-- sparkle burst -->
  <div aria-hidden="true" style="position: absolute; left: 195px; top: 228px; width: 0; height: 0; pointer-events: none">
    <sc-for list="{{sparks}}" as="sp" hint-placeholder-count="22">
      <span style="position: absolute; left: {{sp.left}}; top: {{sp.top}}; width: {{sp.w}}; height: {{sp.h}}; border-radius: 3px; background: {{sp.color}}; transform: {{sp.transform}}; opacity: {{sp.opacity}}"></span>
    </sc-for>
  </div>

  <!-- words + stats -->
  <div style="position: absolute; left: 24px; right: 24px; top: 382px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center">
    <div style="display: flex; flex-direction: column; gap: 8px; align-items: center; opacity: {{titleOpacity}}; transform: translateY({{titleY}})">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 46px; line-height: 1">Beautifully done</h1>
      <p style="margin: 0; font-size: 15px; font-weight: 300; color: #DCE3EE">Screenshots is 1.2 GB lighter.</p>
    </div>

    <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 16px 6px; box-sizing: border-box; border-radius: 24px; border: 1px solid rgba(255,255,255,0.30); background: rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 30px rgba(10,14,22,0.28); opacity: {{statsOpacity}}; transform: translateY({{statsY}})">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 34px; line-height: 1">{{reviewed}}</span>
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 1.4px; color: #C9D2E0">REVIEWED</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; border-left: 1px solid rgba(255,255,255,0.16); border-right: 1px solid rgba(255,255,255,0.16)">
        <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 34px; line-height: 1; color: #A9DCCD">{{kept}}</span>
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 1.4px; color: #C9D2E0">KEPT</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 34px; line-height: 1; color: #F2B8A8">{{deleted}}</span>
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 1.4px; color: #C9D2E0">DELETED</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center; opacity: {{noteOpacity}}; transform: translateY({{noteY}})">
      <span style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.34); background: rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 30px rgba(10,14,22,0.28); display: flex; align-items: center; gap: 8px; font-size: 13px; color: #E7ECF3">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A9DCCD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg>Room for about 400 more photos
      </span>
      <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #AEB8C8; max-width: 300px">Space returns once Recently Deleted empties. Changed your mind? Restore within 30 days.</p>
    </div>
  </div>

  <a href="Albums.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 44px; height: 54px; border-radius: 27px; background: #E6ECF5; color: #1F2633; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Back to Albums</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { t: 0 };
    this.END = 3300;
    this.freedMB = 1200;
    this.tileData = [
      { sky: '#D9A88F', near: '#3F3442', x: -125, y: 250, r: -8 },
      { sky: '#8EA3BF', near: '#2E3A4F', x: 0, y: 290, r: 4 },
      { sky: '#A9BFB6', near: '#2F4640', x: 125, y: 250, r: 9 },
      { sky: '#C9A3B5', near: '#3E3044', x: -150, y: 130, r: -12 },
      { sky: '#B8C0CC', near: '#3D4552', x: 150, y: 130, r: 11 },
      { sky: '#3B4A6B', near: '#161D2E', x: -68, y: 370, r: -5 },
      { sky: '#C7B19E', near: '#4A3C3A', x: 68, y: 370, r: 6 }
    ];
    const colors = ['#E6ECF5', '#A9DCCD', '#F2B8A8', '#FFFFFF'];
    this.sparkData = Array.from({ length: 22 }, (_, i) => ({
      angle: (i / 22) * Math.PI * 2 + (i % 3) * 0.09,
      travel: 46 + (i * 37) % 44,
      streak: i % 2 === 0,
      color: colors[i % colors.length],
      delay: (i % 4) * 40
    }));
    setTimeout(() => this.start(), 450);
  }
  start() {
    if (this.raf) cancelAnimationFrame(this.raf);
    const t0 = performance.now();
    const step = (now) => {
      const t = Math.min(now - t0, this.END);
      this.setState({ t });
      if (t < this.END) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  renderVals() {
    const t = this.state.t;
    const clamp = (v) => Math.max(0, Math.min(1, v));
    const prog = (start, dur) => clamp((t - start) / dur);
    const outCubic = (p) => 1 - Math.pow(1 - p, 3);
    const inCubic = (p) => p * p * p;
    const outBack = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

    // 1. deleted photos drift into the ring (0–1000ms)
    const tiles = this.tileData.map((d, i) => {
      const p = inCubic(prog(i * 70, 560));
      const x = d.x * (1 - p), y = d.y * (1 - p);
      const s = 1 - 0.8 * p;
      return {
        sky: d.sky, near: d.near,
        transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + (d.r * (1 - p)).toFixed(1) + 'deg) scale(' + s.toFixed(3) + ')',
        opacity: (p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4).toFixed(3)
      };
    });

    // 2. ring fills while the number counts up (500–1900ms)
    const fill = outCubic(prog(500, 1400));
    const mb = this.freedMB * fill;
    const big = mb >= 1000;
    const amount = big ? (mb / 1000).toFixed(1) : String(Math.round(mb));
    const unit = big ? 'GB' : 'MB';

    // 3. check pops + sparkle burst + glow (from 1900ms)
    const pop = prog(1900, 420);
    const checkScale = pop === 0 ? 0 : outBack(pop);
    const sparks = this.sparkData.map((d) => {
      const p = prog(1900 + d.delay, 900);
      const dist = 116 + d.travel * outCubic(p);
      const cx = Math.cos(d.angle) * dist, cy = Math.sin(d.angle) * dist;
      const w = d.streak ? 3 : 6, h = d.streak ? 12 : 6;
      const op = p === 0 ? 0 : (p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85);
      const rot = d.streak ? (d.angle * 180 / Math.PI + 90) : 0;
      return {
        left: (cx - w / 2).toFixed(1) + 'px', top: (cy - h / 2).toFixed(1) + 'px',
        w: w + 'px', h: h + 'px', color: d.color,
        transform: 'rotate(' + rot.toFixed(1) + 'deg) scale(' + (1 - 0.4 * p).toFixed(3) + ')',
        opacity: op.toFixed(3)
      };
    });
    const g = prog(1900, 1200);
    const glow = g === 0 ? 0 : (g < 0.25 ? g / 0.25 * 0.9 : 0.9 - (g - 0.25) / 0.75 * 0.5);

    // 4. words rise in
    const rise = (start) => { const p = outCubic(prog(start, 500)); return { o: p.toFixed(3), y: (16 * (1 - p)).toFixed(1) + 'px' }; };
    const tt = rise(2050), st = rise(2250), nt = rise(2450);
    const countUp = (n) => String(Math.round(n * outCubic(prog(2250, 700))));

    return {
      tiles, sparks, amount, unit,
      dash: (691.15 * (1 - fill)).toFixed(2),
      checkScale: checkScale.toFixed(3), checkOpacity: pop > 0 ? 1 : 0,
      glow: glow.toFixed(3), glowScale: (0.85 + 0.2 * outCubic(g)).toFixed(3),
      titleOpacity: tt.o, titleY: tt.y,
      statsOpacity: st.o, statsY: st.y,
      noteOpacity: nt.o, noteY: nt.y,
      reviewed: countUp(38), kept: countUp(31), deleted: countUp(7),
      ringLabel: '1.2 GB cleared. Tap to replay the animation',
      replay: () => this.start()
    };
  }
}
</script>
</body>
</html>
