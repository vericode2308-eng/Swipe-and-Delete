<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Albums (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#262E3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; isolation: isolate; background: #EEF1F6; font-family: Inter, -apple-system, system-ui, sans-serif; color: #1F2633; display: flex; flex-direction: column; padding: 62px 20px 20px; gap: 14px; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden">
    <div style="position: absolute; left: -90px; top: -60px; width: 320px; height: 320px; border-radius: 50%; background: #A9BCDA; filter: blur(70px); opacity: 0.9"></div>
    <div style="position: absolute; right: -110px; top: 300px; width: 300px; height: 300px; border-radius: 50%; background: #E3C3CD; filter: blur(80px); opacity: 0.85"></div>
    <div style="position: absolute; left: -40px; bottom: -80px; width: 300px; height: 260px; border-radius: 50%; background: #B7D6CF; filter: blur(80px); opacity: 0.85"></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 38px; letter-spacing: 0.2px">Albums</h1>
    <a href="#" aria-label="About Lighter" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.80); background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 10px 30px rgba(40,55,79,0.12); display: flex; align-items: center; justify-content: center; color: #1F2633; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.01"/></svg></a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px">Quick clean-up</h2>
      <span style="font-size: 11px; color: #566072">Found on this iPhone</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 26px; border: 1px solid rgba(255,255,255,0.80); background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 10px 30px rgba(40,55,79,0.12)">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <a href="DawnSwipe.dc.html" style="height: 58px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.5); display: flex; align-items: center; gap: 12px; padding: 0 14px; text-decoration: none; color: #1F2633">
          <span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 17px; background: {{f.tint}}; display: flex; align-items: center; justify-content: center; color: #1F2633">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"/></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-size: 15px; font-weight: 600">{{f.name}}</span>
            <span style="font-size: 12px; color: #566072">{{f.detail}}</span>
          </span>
          <span style="font-size: 13px; font-weight: 600; color: #1F2633; white-space: nowrap">{{f.count}}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#566072" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 8px; margin-top: 2px">
    <span style="height: 32px; padding: 0 16px; border-radius: 16px; background: #262E3B; color: #F4F6FA; font-size: 13px; font-weight: 600; display: flex; align-items: center">All</span>
    <span style="height: 32px; padding: 0 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.80); background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 10px 30px rgba(40,55,79,0.12); color: #1F2633; font-size: 13px; font-weight: 500; display: flex; align-items: center">Smart Albums</span>
    <span style="height: 32px; padding: 0 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.80); background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 10px 30px rgba(40,55,79,0.12); color: #1F2633; font-size: 13px; font-weight: 500; display: flex; align-items: center">My Albums</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{albums}}" as="a" hint-placeholder-count="4">
      <a href="DawnSwipe.dc.html" style="position: relative; height: 138px; border-radius: 22px; overflow: hidden; text-decoration: none; color: #1F2633; background: {{a.sky}}; border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 12px 30px rgba(40,55,79,0.16)">
        <div aria-hidden="true" style="position: absolute; left: -10%; right: -10%; bottom: 30%; height: 40%; background: {{a.far}}; clip-path: polygon(0 100%, 18% 35%, 34% 70%, 52% 10%, 70% 60%, 86% 30%, 100% 100%)"></div>
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: {{a.near}}; clip-path: polygon(0 30%, 25% 0, 45% 40%, 70% 10%, 100% 45%, 100% 100%, 0 100%)"></div>
        <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 8px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,1); display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 600">{{a.name}}</span>
          <span style="font-size: 12px; color: #3E4757">{{a.count}}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <a href="#" style="align-self: center; margin-top: auto; font-size: 13px; text-decoration: none; padding: 8px; color: #566072">Limited access · <span style="text-decoration: underline; color: #262E3B">Manage selection</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      filters: [
        { name: 'Duplicates', detail: 'Same or near-identical shots', count: '86 in 31 sets', tint: 'rgba(169,188,218,0.75)',
          icon: 'M8 8h11v11H8z M5 16V5h11' },
        { name: 'Pages & Things', detail: 'Notes, documents, no people', count: '212', tint: 'rgba(242,184,168,0.70)',
          icon: 'M7 3h7l4 4v14H7z M14 3v4h4 M10 12h5 M10 16h5' },
        { name: 'From WhatsApp', detail: 'Saved from your chats', count: '1,480', tint: 'rgba(169,220,205,0.75)',
          icon: 'M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z' }
      ],
      albums: [
        { name: 'All Photos', count: '4,812 items', sky: '#8EA3BF', far: '#5E6F8A', near: '#2E3A4F' },
        { name: 'Screenshots', count: '1,206 items', sky: '#D9A88F', far: '#8B6B73', near: '#3F3442' },
        { name: 'Videos', count: '318 items', sky: '#3B4A6B', far: '#2A3550', near: '#161D2E' },
        { name: 'Selfies', count: '402 items', sky: '#A9BFB6', far: '#6E8A80', near: '#2F4640' }
      ]
    };
  }
}
</script>
</body>
</html>
