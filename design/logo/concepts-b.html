<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lighter icon, direction B with cues</title>
<style>
:root{--slate:#262E3B;--blue:#5E7AA6;--rose:#9A6F80;--teal:#3F6B66;--blush:#F2B8A8;--sage:#A9DCCD;--ink:#2A1A16;--sageink:#1B4A3C}
*{box-sizing:border-box;margin:0}
body{background:#161b24;width:2300px;padding:50px;font:28px system-ui;color:#C9D2E0}
.row{display:flex;gap:50px;align-items:flex-end;margin-bottom:40px}
.col{display:flex;flex-direction:column;gap:16px}
.icon{width:1024px;height:1024px;position:relative;overflow:hidden;background:var(--slate)}
.b{position:absolute;border-radius:50%;filter:blur(130px)}
.b1{width:900px;height:900px;left:-250px;top:-300px;background:var(--blue)}
.b2{width:760px;height:760px;right:-260px;top:140px;background:var(--rose)}
.b3{width:900px;height:800px;left:-80px;bottom:-380px;background:var(--teal)}
.glass{position:absolute;width:420px;height:560px;border-radius:70px;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);
 backdrop-filter:blur(34px) saturate(170%);box-shadow:0 40px 80px rgba(10,14,22,.4),inset 0 4px 0 rgba(255,255,255,.5)}
.photo{position:absolute;inset:34px;border-radius:44px;overflow:hidden;background:rgba(255,255,255,.14)}
.photo:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.7);left:62px;top:62px}
.photo:after{content:"";position:absolute;left:-40px;right:-40px;bottom:-60px;height:230px;border-radius:50% 50% 0 0;background:rgba(255,255,255,.42)}
.badge{position:absolute;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;
 box-shadow:0 24px 50px rgba(10,14,22,.4),inset 0 4px 0 rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.5)}
.badge svg{width:110px;height:110px;fill:none;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.del{background:var(--blush)}.del svg{stroke:var(--ink)}
.keep{background:var(--sage)}.keep svg{stroke:var(--sageink)}
/* B1: back card carries the cross, front card carries the tick */
#B1 .back{left:150px;top:330px;transform:rotate(-12deg);opacity:.8}
#B1 .front{left:430px;top:190px;transform:rotate(7deg);background:rgba(255,255,255,.22)}
#B1 .d{left:110px;top:250px}
#B1 .k{left:690px;top:600px}
/* B2: symmetric, cross left, tick right, photo in the middle */
#B2 .l{left:60px;top:290px;transform:rotate(-14deg);opacity:.8}
#B2 .r{left:544px;top:290px;transform:rotate(14deg);opacity:.8}
#B2 .m{left:302px;top:210px;background:rgba(255,255,255,.24)}
#B2 .d{left:70px;top:210px}
#B2 .k{left:744px;top:210px}
.sm{display:flex;gap:30px;align-items:flex-end;padding:20px 0}
.sm>div{border-radius:22.4%;overflow:hidden;position:relative}
.sm .icon{position:absolute;left:0;top:0;transform-origin:0 0}
</style></head><body>
<div class="row">
 <div class="col"><div class="icon" id="B1"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i>
  <div class="glass back"><div class="photo"></div></div>
  <div class="glass front"><div class="photo"></div></div>
  <div class="badge del d"><svg viewBox="0 0 100 100"><path d="M24 24L76 76M76 24L24 76"/></svg></div>
  <div class="badge keep k"><svg viewBox="0 0 100 100"><path d="M20 54L42 76L82 28"/></svg></div>
 </div>B1 · Cross on the back card, tick on the front card</div>
 <div class="col"><div class="icon" id="B2"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i>
  <div class="glass l"><div class="photo"></div></div>
  <div class="glass r"><div class="photo"></div></div>
  <div class="glass m"><div class="photo"></div></div>
  <div class="badge del d"><svg viewBox="0 0 100 100"><path d="M24 24L76 76M76 24L24 76"/></svg></div>
  <div class="badge keep k"><svg viewBox="0 0 100 100"><path d="M20 54L42 76L82 28"/></svg></div>
 </div>B2 · Left cross, right tick, photo between</div>
</div>
<div class="sm" id="sm"></div>
<script>
// small-size check: clone each icon at 180, 120 and 60 px
const sm=document.getElementById('sm');
['B1','B2'].forEach(id=>[180,120,60].forEach(s=>{
 const w=document.createElement('div');w.style.width=w.style.height=s+'px';
 const c=document.getElementById(id).cloneNode(true);c.style.transform='scale('+s/1024+')';
 w.appendChild(c);sm.appendChild(w);}));
</script>
</body></html>
